name: FIR reproduction

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - run: bash setup.sh
      - run: .venv/bin/python -B reproduce.py smoke
      - run: .venv/bin/python -B verify_paper.py
      - name: Verify native labels and whole-block budget
        run: |
          .venv/bin/python -B reproduce.py quick --fte 350 --jobs 2 > "$RUNNER_TEMP/quick.json"
          cat "$RUNNER_TEMP/quick.json"
          .venv/bin/python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert len(r["actions"]) == 3 and r["used_FTE"] == "300"; assert r["native_witnesses"]["fault_cases"] == 160 and r["native_witnesses"]["FTE"] == "200"' "$RUNNER_TEMP/quick.json"
