name: FIR reproduction

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -B reproduce.py smoke
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends verilator
      - run: python -B reproduce.py quick --fte 300 --jobs 2
